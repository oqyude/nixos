repos:
  - repo: local
    hooks:
      - id: nixos-flake-checks
        name: nixos flake invariant checks
        description: |
          Runs .ci/checks.sh: sops path_regex compliance, no
          `:latest` in container images (whitelist: tape-rotation only),
          and `nix flake check` (skippable via --no-build).
        entry: bash .ci/checks.sh --no-build
        language: script
        pass_filenames: false
        always_run: true
